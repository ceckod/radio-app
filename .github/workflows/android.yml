name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Build debug APK
      run: |
        chmod +x gradlew
        ./gradlew :openopenradiomobile:assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: radio-apk
        path: openopenradiomobile/build/outputs/apk/debug/*.apk
